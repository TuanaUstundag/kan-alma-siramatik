<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sıra Al | Kan Alma Ünitesi</title>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Siramatik">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2869/2869818.png">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between text-slate-800 antialiased selection:bg-blue-500 selection:text-white">

    <!-- Mobile Header -->
    <header class="bg-gradient-to-r from-blue-700 via-blue-600 to-indigo-700 text-white shadow-lg px-5 py-5 flex items-center justify-between sticky top-0 z-30">
        <div class="flex items-center space-x-3">
            <div class="bg-white/10 p-2 rounded-xl backdrop-blur-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                </svg>
            </div>
            <div>
                <h1 class="text-base font-extrabold tracking-wide uppercase">MERKEZ LABORATUVARI</h1>
                <p class="text-[11px] text-blue-100 font-medium">Temassız Mobil Sıramatik</p>
            </div>
        </div>
        <div class="text-right">
            <span class="text-xs bg-white/20 text-white px-2.5 py-1 rounded-full font-bold uppercase tracking-wider">Lobi</span>
        </div>
    </header>

    <!-- Main Mobile Content Area -->
    <main class="flex-grow flex flex-col justify-center px-4 py-6 max-w-md mx-auto w-full space-y-6">
        
        <!-- Welcome Card -->
        <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-6 sm:p-8 space-y-6 text-center">
            
            <div class="space-y-2">
                <div class="inline-flex items-center justify-center p-3 bg-blue-50 text-blue-600 rounded-2xl mb-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
                    </svg>
                </div>
                <h2 class="text-2xl font-black text-slate-800">Sıra Numaranızı Alın</h2>
                <p class="text-slate-500 text-xs leading-relaxed">
                    Aşağıdan durumunuza uygun seçeneğe dokununuz. Numaranız oluşturulduktan sonra sıranız anlık olarak bu ekrandan takip edilecektir.
                </p>
            </div>

            <!-- Optional Patient Name Field -->
            <div class="space-y-1.5 text-left">
                <label for="input-patient-name" class="block text-xs font-bold text-slate-500 uppercase tracking-wider">
                    Hasta Adı Soyadı <span class="text-slate-400 font-normal lowercase">(isteğe bağlı)</span>
                </label>
                <input 
                    id="input-patient-name" 
                    type="text" 
                    placeholder="Örn: Ahmet Yılmaz" 
                    maxlength="40"
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all"
                >
            </div>

            <!-- Ticket Type Buttons (Standard & Priority) -->
            <div class="space-y-3.5 pt-2">
                <!-- Standard Ticket Button -->
                <button 
                    id="btn-get-standard" 
                    type="button" 
                    class="w-full py-4 px-5 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white rounded-2xl font-bold shadow-lg shadow-blue-500/20 transition-all duration-150 flex items-center justify-between group"
                >
                    <div class="flex items-center space-x-3 text-left">
                        <div class="bg-white/20 p-2.5 rounded-xl group-hover:bg-white/30 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
                            </svg>
                        </div>
                        <div>
                            <div class="text-base font-extrabold tracking-wide">STANDART SIRA AL</div>
                            <div class="text-[11px] text-blue-100 font-medium">Genel Kan Alma Sırası (K-100)</div>
                        </div>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-200 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
                    </svg>
                </button>

                <!-- Priority Ticket Button -->
                <button 
                    id="btn-get-priority" 
                    type="button" 
                    class="w-full py-4 px-5 bg-gradient-to-r from-amber-500 via-rose-500 to-pink-600 hover:from-amber-600 hover:to-rose-600 active:scale-[0.98] text-white rounded-2xl font-bold shadow-lg shadow-rose-500/20 transition-all duration-150 flex items-center justify-between border border-amber-300/30 group"
                >
                    <div class="flex items-center space-x-3 text-left">
                        <div class="bg-white/20 p-2.5 rounded-xl group-hover:bg-white/30 transition-colors text-xl flex items-center justify-center">
                            ♿
                        </div>
                        <div>
                            <div class="text-base font-extrabold tracking-wide flex items-center space-x-1.5">
                                <span>ÖNCELİKLİ SIRA AL</span>
                                <span class="bg-white/25 text-white text-[9px] px-1.5 py-0.5 rounded font-black uppercase">Öncelikli</span>
                            </div>
                            <div class="text-[11px] text-amber-50 font-medium">65+ Yaş, Hamile, Engelli, Gazi</div>
                        </div>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-amber-200 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
                    </svg>
                </button>
            </div>

            <!-- Current Queue Status Summary -->
            <div class="pt-4 border-t border-slate-100 grid grid-cols-2 gap-3 text-slate-600 text-xs">
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <span class="block text-slate-400 text-[10px] font-bold uppercase">Bekleyen Toplam</span>
                    <span id="mobile-waiting-count" class="text-lg font-black text-slate-800">-</span>
                </div>
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <span class="block text-slate-400 text-[10px] font-bold uppercase">Son Çağrılan</span>
                    <span id="mobile-last-called" class="text-lg font-black text-blue-600">-</span>
                </div>
            </div>

        </div>

    </main>

    <!-- Mobile Footer -->
    <footer class="bg-white border-t border-slate-100 py-3 text-center text-[11px] text-slate-400">
        © 2026 Hastane Bilgi İşlem Direktörlüğü
    </footer>

    <!-- Socket.IO and Mobile Kiosk Logic -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/mobile-kiosk.js"></script>
    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => console.log('Service Worker registered:', reg.scope))
            .catch(err => console.error('Service Worker registration failed:', err));
        });
      }
    </script>
</body>
</html>
