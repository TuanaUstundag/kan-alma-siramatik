<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kan Alma Sıramatik | Mobil Uygulama</title>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Siramatik">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2869/2869818.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-blue-600 via-indigo-700 to-slate-900 min-h-screen flex flex-col justify-between text-white p-4 select-none">

    <!-- Header -->
    <header class="text-center pt-6 space-y-2">
        <div class="inline-flex p-3.5 bg-white/10 backdrop-blur-md rounded-2xl border border-white/20 shadow-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
            </svg>
        </div>
        <h1 class="text-2xl font-black tracking-tight">MERKEZ LABORATUVARI</h1>
        <p class="text-xs text-blue-200 font-medium">Kan Alma Sıra & Takip Sistemi</p>
    </header>

    <!-- Main Navigation Action Cards -->
    <main class="w-full max-w-sm mx-auto space-y-4 my-auto py-6">
        
        <!-- Action 1: Sira Al (Mobile Kiosk) -->
        <a href="/mobile-kiosk.html" class="block w-full bg-white text-slate-800 rounded-3xl p-5 shadow-2xl shadow-blue-900/40 hover:bg-slate-50 active:scale-[0.98] transition-all border border-white/80">
            <div class="flex items-center space-x-4">
                <div class="p-3 bg-blue-100 text-blue-600 rounded-2xl">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
                    </svg>
                </div>
                <div class="flex-1 text-left">
                    <h3 class="font-black text-lg text-slate-900 leading-tight">Sıra Numarası Al</h3>
                    <p class="text-xs text-slate-500 font-medium mt-0.5">Standart veya Öncelikli Sıra</p>
                </div>
                <span class="text-slate-400 font-bold text-lg">→</span>
            </div>
        </a>

        <!-- Action 2: Portal / Hemşire Girişi -->
        <a href="/portal.html" class="block w-full bg-white/10 backdrop-blur-md hover:bg-white/20 active:scale-[0.98] transition-all rounded-3xl p-4 border border-white/20 shadow-lg text-white">
            <div class="flex items-center space-x-4">
                <div class="p-2.5 bg-white/20 rounded-2xl">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
                <div class="flex-1 text-left">
                    <h3 class="font-bold text-sm text-white leading-tight">Çalışan & Yönetici Portalı</h3>
                    <p class="text-[11px] text-blue-200 font-medium mt-0.5">Hemşire ve Admin Girişi</p>
                </div>
                <span class="text-white/60 font-bold">→</span>
            </div>
        </a>

        <!-- Action 3: TV Ekranı -->
        <a href="/display.html" class="block w-full text-center py-2 text-xs text-blue-200 hover:text-white font-semibold transition-colors">
            📺 TV Çağrı Ekranını Aç
        </a>

    </main>

    <!-- Footer -->
    <footer class="text-center pb-4 text-xs text-blue-300/80 font-medium">
        Hastane Sıramatik Mobil Sistemi
    </footer>

    <!-- Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js').catch(() => {});
        });
      }
    </script>
</body>
</html>
